<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Invisible Stopwatch</title>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
    html,body{width:100%;height:100%;background:#000;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;touch-action:manipulation}
    #root{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;align-items:center;background:#000;padding:24px;position:relative}
    .panel{width:100%;height:100%;display:none;flex-direction:column;justify-content:space-between;align-items:center;padding:32px 16px;position:absolute;top:0;left:0;right:0;bottom:0}
    .panel.on{display:flex}
    #p0{justify-content:center;align-items:center}
    .btn-c{width:160px;height:160px;border-radius:50%;border:none;outline:none;cursor:pointer;display:flex;justify-content:center;align-items:center;font-weight:900;letter-spacing:2px;text-transform:uppercase;transition:transform .12s,box-shadow .12s;position:relative}
    .btn-c:hover{transform:scale(1.04)}
    .btn-c:active{transform:scale(.96)}
    .btn-c:focus-visible{box-shadow:0 0 0 4px rgba(255,255,255,.4)}
    .btn-a{background:#ff2a55;color:#fff;font-size:24px;box-shadow:0 8px 32px rgba(255,42,85,.4)}
    .btn-b{background:#ff453a;color:#fff;font-size:24px;box-shadow:0 8px 32px rgba(255,69,58,.4)}
    .btn-r{background:#ff2a55;color:#fff;font-size:18px;letter-spacing:1.5px;box-shadow:0 8px 32px rgba(255,42,85,.4)}
    .c-act{flex:1;display:flex;justify-content:center;align-items:center;max-width:680px;width:100%;padding:20px;text-align:center}
    .t-act{font-size:clamp(28px,6vw,44px);font-weight:900;line-height:1.35;color:#fff;word-break:break-word}
    .c-btn{width:100%;display:flex;justify-content:center;align-items:center;padding-bottom:24px}
    .c-res{flex:1;display:flex;justify-content:center;align-items:center;width:100%;text-align:center}
    .t-res{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:clamp(48px,14vw,88px);font-weight:900;color:#fff;letter-spacing:-1px}
    .spc{height:32px}
  </style>
</head>
<body>
  <main id="root">
    <section id="p0" class="panel on">
      <button id="b0" class="btn-c btn-a">START</button>
    </section>
    <section id="p1" class="panel">
      <div class="spc"></div>
      <div class="c-act"><h1 id="ta" class="t-act"></h1></div>
      <div class="c-btn"><button id="b1" class="btn-c btn-b">STOP</button></div>
    </section>
    <section id="p2" class="panel">
      <div class="spc"></div>
      <div class="c-res"><h1 id="tr" class="t-res">00:00:00</h1></div>
      <div class="c-btn"><button id="b2" class="btn-c btn-r">TRY AGAIN</button></div>
    </section>
  </main>
